<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 260 312" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- popup card -->
  <rect x="1" y="1" width="258" height="310" rx="12" fill="#0f1116" filter="url(#sh)"/>

  <text x="14" y="26" fill="#e8eaed" font-size="13" font-weight="600" letter-spacing="0.3">TypingLogger</text>
  <text x="14" y="41" fill="#9aa0aa" font-size="11">Today's typing</text>

  <!-- row 1 -->
  <g>
    <rect x="14" y="50" width="112" height="62" rx="10" fill="#181b22"/>
    <text x="70" y="82" fill="#5b9dff" font-size="22" font-weight="700" text-anchor="middle">62</text>
    <text x="70" y="98" fill="#9aa0aa" font-size="9" letter-spacing="0.5" text-anchor="middle">WPM</text>

    <rect x="134" y="50" width="112" height="62" rx="10" fill="#181b22"/>
    <text x="190" y="82" fill="#46c98b" font-size="22" font-weight="700" text-anchor="middle">96%</text>
    <text x="190" y="98" fill="#9aa0aa" font-size="9" letter-spacing="0.5" text-anchor="middle">SPELLING ACC.</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="14" y="120" width="112" height="62" rx="10" fill="#181b22"/>
    <text x="70" y="152" fill="#e8eaed" font-size="22" font-weight="700" text-anchor="middle">1,240</text>
    <text x="70" y="168" fill="#9aa0aa" font-size="9" letter-spacing="0.5" text-anchor="middle">WORDS</text>

    <rect x="134" y="120" width="112" height="62" rx="10" fill="#181b22"/>
    <text x="190" y="152" fill="#e8eaed" font-size="22" font-weight="700" text-anchor="middle">7,830</text>
    <text x="190" y="168" fill="#9aa0aa" font-size="9" letter-spacing="0.5" text-anchor="middle">CHARACTERS</text>
  </g>

  <text x="14" y="200" fill="#9aa0aa" font-size="10.5">Keystroke accuracy 98% · 14 autocorrections today</text>
  <text x="14" y="216" fill="#9aa0aa" font-size="10.5">All-time: 48,210 words · 58 WPM · 95% spelling</text>

  <!-- buttons -->
  <rect x="14" y="228" width="232" height="34" rx="8" fill="#5b9dff"/>
  <text x="130" y="250" fill="#06101f" font-size="12" font-weight="600" text-anchor="middle">Open dashboard</text>

  <rect x="14" y="268" width="232" height="32" rx="8" fill="none" stroke="#2a2e37"/>
  <text x="130" y="288" fill="#9aa0aa" font-size="12" text-anchor="middle">Reset all stats</text>
</svg>
