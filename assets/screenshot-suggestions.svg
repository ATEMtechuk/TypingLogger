<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- faux web page -->
  <rect x="0" y="0" width="520" height="240" rx="12" fill="#f5f6f8"/>
  <rect x="0" y="0" width="520" height="40" rx="12" fill="#e9ebf0"/>
  <rect x="0" y="20" width="520" height="20" fill="#e9ebf0"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="20" r="5" fill="#febc2e"/>
  <circle cx="56" cy="20" r="5" fill="#28c840"/>
  <rect x="120" y="11" width="280" height="18" rx="9" fill="#ffffff"/>
  <text x="134" y="24" fill="#9aa0aa" font-size="10">example.com</text>

  <!-- a search field on the page -->
  <text x="40" y="82" fill="#5f6773" font-size="13">Search</text>
  <rect x="40" y="92" width="440" height="46" rx="23" fill="#ffffff" stroke="#d4d8e0" filter="url(#s2)"/>
  <text x="64" y="121" fill="#202124" font-size="17">how to recei</text>
  <rect x="169" y="106" width="1.6" height="20" fill="#202124"/>

  <!-- the TypingLogger suggestion bar (dark, as rendered by the extension) -->
  <g filter="url(#s2)">
    <rect x="64" y="150" width="300" height="34" rx="8" fill="#181b22" stroke="#2a2e37"/>
    <!-- chip 1 (highlighted) -->
    <rect x="70" y="155" width="78" height="24" rx="6" fill="#243b66"/>
    <text x="109" y="171" fill="#e8eaed" font-size="13" text-anchor="middle">received</text>
    <!-- chip 2 -->
    <text x="192" y="171" fill="#e8eaed" font-size="13" text-anchor="middle">receive</text>
    <!-- chip 3 -->
    <text x="285" y="171" fill="#e8eaed" font-size="13" text-anchor="middle">receiving</text>
    <!-- tab hint -->
    <text x="345" y="171" fill="#6b7280" font-size="13" text-anchor="middle">⇥</text>
  </g>

  <text x="64" y="208" fill="#9aa0aa" font-size="12">Completions appear as you type — press</text>
  <rect x="288" y="197" width="34" height="16" rx="4" fill="#e3e6ec"/>
  <text x="305" y="209" fill="#5f6773" font-size="11" text-anchor="middle">Tab</text>
  <text x="326" y="208" fill="#9aa0aa" font-size="12">to accept.</text>
</svg>
